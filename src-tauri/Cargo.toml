[package]
name = "wechat-connection-demo"
version = "0.1.0"
description = "Android WeChat nickname connection demo"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
wait-timeout = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
