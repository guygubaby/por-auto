[package]
name = "wechat-connection-demo"
version = "0.3.3"
description = "Android workflow automation with uiautomator2"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
wait-timeout = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.14.0"
chrono = "0.4"
chrono-tz = "0.10.4"
croner = "4.0.1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
semver = "1"
png = "0.18"

[dev-dependencies]
minisign-verify = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
