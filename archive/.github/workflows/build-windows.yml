name: Windows MyGo trial installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['outputs/**','work/**','**/*.md']
permissions: {contents: read}
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true}
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:adb windows
      - run: pnpm prepare:assets
      - run: pnpm registry:check
      - run: pnpm test:mobile
      - run: pnpm test
      - run: go test ./internal/...
      - name: Verify bundled ADB paths
        shell: pwsh
        run: |
          $component = Join-Path $env:RUNNER_TEMP 'por-adb-path-test'
          Expand-Archive assets/platform-tools.zip $component -Force
          $env:POR_ADB_TEST_BINARY = Join-Path $component 'platform-tools/adb.exe'
          pnpm test:adb-paths
      - run: go run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: por-auto-windows-x64
          path: |
            build/windows-amd64/*.exe
            deliverables/客户试用说明.md
