name: Signed desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            adb: windows
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            adb: macos
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            adb: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Validate release version and tests
        shell: bash
        run: |
          pnpm release:check --tag "$RELEASE_TAG"
          pnpm registry:check
          pnpm test:devices
          pnpm test:schedules
          pnpm test:updates
      - run: pnpm prepare:adb ${{ matrix.adb }}
      - run: pnpm prepare:u2
      - name: Verify Windows ADB resource paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $component = Join-Path $env:RUNNER_TEMP 'por-adb-path-test'
          Expand-Archive src-tauri/resources/platform-tools.zip $component -Force
          $env:POR_ADB_TEST_BINARY = Join-Path $component 'platform-tools/adb.exe'
          pnpm test:adb-paths
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build signed installer and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
      - name: Validate signed artifact set and assemble update manifest
        run: node scripts/release-manifest.mjs --tag "$RELEASE_TAG"
      - name: Publish only after every platform is ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) throw new Error('Published versions cannot be overwritten; bump the version')"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "Por Auto ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
