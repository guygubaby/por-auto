name: Signed MyGo desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, platform: darwin/arm64, target: darwin-arm64, adb: macos}
          - {os: macos-latest, platform: darwin/amd64, target: darwin-amd64, adb: macos}
          - {os: windows-latest, platform: windows/amd64, target: windows-amd64, adb: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.RELEASE_TAG }}'}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true}
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:adb ${{ matrix.adb }}
      - run: pnpm prepare:assets
      - run: pnpm release:check --tag ${{ env.RELEASE_TAG }}
      - run: pnpm registry:check
      - run: pnpm test:mobile
      - run: pnpm test
      - run: go test ./internal/...
      - run: pnpm test:updates
      - name: Build signed MyGo archive and installer
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "Missing MyGo updater signing key" >&2; exit 1; }
          go run github.com/egoist/mygo/cmd/mygo build -platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: build/${{ matrix.target }}/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.RELEASE_TAG }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'release-*', path: release-artifacts}
      - run: node scripts/release-manifest.mjs --tag ${{ env.RELEASE_TAG }}
      - name: Publish complete signed artifact set
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "Por Auto ${RELEASE_TAG#v}" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
