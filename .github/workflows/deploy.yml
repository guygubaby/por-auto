name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'updates/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Build admin
        run: |
          set -euo pipefail
          cd admin
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd updates
          pnpm dlx wrangler@latest deploy

      - name: Verify site
        run: |
          set -euo pipefail
          CODE=""
          for _ in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' https://por-auto.guygubaby.top/ || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "站点返回 $CODE" >&2; exit 1; }
          curl -fsS https://por-auto.guygubaby.top/latest >/dev/null
