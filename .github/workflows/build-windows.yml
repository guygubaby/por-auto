name: Windows trial installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['outputs/**', 'work/**', 'mobile/**', 'mobile-workflows/**', 'scripts/mobile-scripts.mjs', 'scripts/test-mobile-updater.mjs', '.github/workflows/mobile-scripts.yml', '**/*.md']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm test:mobile
      - run: pnpm prepare:adb windows
      - run: pnpm prepare:u2
      - name: Verify Windows ADB resource paths
        shell: pwsh
        run: |
          $component = Join-Path $env:RUNNER_TEMP 'por-adb-path-test'
          Expand-Archive src-tauri/resources/platform-tools.zip $component -Force
          $env:POR_ADB_TEST_BINARY = Join-Path $component 'platform-tools/adb.exe'
          pnpm test:adb-paths
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify native credential storage
        run: cargo test --manifest-path src-tauri/Cargo.toml desktop_credentials -- --ignored
      - run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: por-auto-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            deliverables/客户试用说明.md
